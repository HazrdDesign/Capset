name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependencies
        # Not requirements.txt: onnx-asr and onnxruntime pull ~200 MB and the
        # suite deliberately fakes the engine, so they buy nothing here.
        run: pip install pytest fastapi "uvicorn[standard]" python-multipart httpx numpy
      - name: Run tests
        working-directory: backend
        run: python -m pytest tests -q

  panel:
    name: Panel tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run tests
        working-directory: panel
        run: npm test

  payload:
    name: Payload staging
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Stage installer payload
        run: python installer/build_payload.py
      - name: Verify no development files leaked
        run: |
          for f in tests package.json node_modules; do
            if [ -e "build/payload/panel/$f" ]; then
              echo "development file leaked into payload: $f" >&2
              exit 1
            fi
          done
          echo "payload is clean"

  installer:
    name: Installer script lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Guard against HKCU writes under elevation
        # Setup runs elevated to write Common Files, so a [Registry] entry
        # targeting HKCU lands in the ADMINISTRATOR's hive rather than the
        # logged-in user's. PlayerDebugMode would end up in the wrong profile,
        # CEP would keep refusing the unsigned extension, and the panel would
        # never appear in After Effects. Inno Setup only warns; CI fails.
        run: |
          iss=installer/windows/capset.iss
          if grep -qiE '^\s*Root:\s*HKCU' "$iss"; then
            echo "::error::$iss writes HKCU from a [Registry] section while running elevated." >&2
            echo "Use [Run] with reg.exe and Flags: runasoriginaluser instead." >&2
            exit 1
          fi
          if ! grep -q 'runasoriginaluser' "$iss"; then
            echo "::error::PlayerDebugMode must be set via runasoriginaluser." >&2
            exit 1
          fi
          for v in 9 10 11 12; do
            grep -q "CSXS.$v" "$iss" || { echo "::error::missing CSXS.$v key" >&2; exit 1; }
          done
          # Upgrading over a running backend fails with "DeleteFile failed;
          # code 32 — being used by another process" on every locked file in
          # turn. The service is windowless, so Restart Manager does not
          # reliably catch it; Setup must terminate it explicitly first.
          if ! grep -q 'PrepareToInstall' "$iss"; then
            echo "::error::installer must stop the running backend before copying files" >&2
            echo "Add a [Code] PrepareToInstall that terminates capset-backend.exe." >&2
            exit 1
          fi
          if ! grep -q 'taskkill' "$iss"; then
            echo "::error::no taskkill found — upgrades will fail on locked files" >&2
            exit 1
          fi
          if ! grep -q 'InitializeUninstall' "$iss"; then
            echo "::error::uninstall must stop the backend too, or it leaves locked files" >&2
            exit 1
          fi
          # runasoriginaluser is a [Run]-only flag. Inno Setup rejects it in
          # [UninstallRun] and aborts the compile, which cost a build.
          if awk '/^\[UninstallRun\]/{f=1;next} /^\[/{f=0} f' "$iss" | grep -q 'runasoriginaluser'; then
            echo "::error::runasoriginaluser is not valid in [UninstallRun]" >&2
            exit 1
          fi
          # The panel starts the backend on demand, which it can only do if it
          # knows where Setup put it. DefaultDirName is a default, not a
          # promise -- the user can install anywhere -- so the real path must
          # be recorded. Without it every install to a non-default directory
          # reports "the transcription service is not running" forever.
          if ! grep -q 'backend-path.txt' "$iss"; then
            echo "::error::$iss never records the backend path for the panel" >&2
            echo "Add a CurStepChanged that writes backend-path.txt into the extension folder." >&2
            exit 1
          fi
          if ! grep -q 'backend-path.txt' installer/macos/build-pkg.sh; then
            echo "::error::the macOS package never records the backend path" >&2
            exit 1
          fi
          # Both files are read by panel/js/main.js; a rename on one side only
          # is silent at build time and fatal at run time.
          grep -q 'backend-path.txt' panel/js/main.js || {
            echo "::error::the panel no longer reads backend-path.txt" >&2; exit 1; }
          echo "installer script OK"
