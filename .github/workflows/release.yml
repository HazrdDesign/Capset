name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version, e.g. 0.1.0"
        required: true
        default: "0.1.0"
      prerelease:
        description: "Mark the release as a pre-release"
        type: boolean
        default: true
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  windows:
    name: Windows installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Resolve version
        id: version
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "value=${{ github.event.inputs.version }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pyinstaller

      - name: Build backend with PyInstaller
        working-directory: backend
        # PyInstaller is not a cross-compiler: a Windows exe can only be
        # produced on Windows. That is the whole reason this job exists.
        run: pyinstaller capset-backend.spec --noconfirm --distpath dist --workpath build

      - name: Verify the backend binary exists
        shell: bash
        run: |
          test -f backend/dist/capset-backend/capset-backend.exe \
            || { echo "PyInstaller produced no exe"; ls -R backend/dist; exit 1; }
          echo "backend binary present"

      - name: Verify the ASR stack is actually bundled
        shell: bash
        # /health answers even when the engine is unusable, so "the service
        # responded" cannot distinguish a working bundle from a broken one.
        # v0.1.3 passed the smoke test and shipped with onnxruntime
        # unimportable. This check fails the build instead.
        run: |
          if ! ./backend/dist/capset-backend/capset-backend.exe --selftest; then
            echo "::error::the packaged bundle cannot import onnxruntime/onnx_asr"
            exit 1
          fi

      - name: Smoke-test the backend binary
        shell: bash
        # Verifying the exe EXISTS is not the same as verifying it RUNS. A
        # PyInstaller bundle can build cleanly and still die at startup on a
        # missing hidden import or an uncollected native DLL — which would
        # reach users as "the panel says the service is unreachable" with no
        # clue why. Start it and require a real HTTP answer.
        run: |
          ./backend/dist/capset-backend/capset-backend.exe > backend-start.log 2>&1 &
          pid=$!
          ok=0
          for i in $(seq 1 30); do
            # Bail the moment the process dies rather than retrying a corpse
            # for a minute — the traceback is already in the log.
            if ! kill -0 $pid 2>/dev/null; then
              echo "::error::backend binary exited during startup"
              echo "--- backend output ---"; cat backend-start.log
              exit 1
            fi
            if curl -fsS --max-time 3 http://127.0.0.1:8756/health -o health.json; then
              ok=1; break
            fi
            sleep 2
          done
          kill $pid 2>/dev/null || true
          if [ "$ok" != "1" ]; then
            echo "::error::backend binary did not serve /health — the bundle is broken"
            echo "--- backend output ---"; cat backend-start.log
            exit 1
          fi
          echo "backend responded:"; cat health.json

      - name: Download the speech model
        # Bundled rather than downloaded on the user's machine, so a shipped
        # Capset never depends on a third-party Hugging Face account still
        # existing under the same name. Exits non-zero if the download is
        # short or empty, because the alternative is shipping a gigabyte-sized
        # installer that cannot transcribe and finding out from a customer.
        run: >
          python backend/capset_service.py
          --stage-model ${{ github.workspace }}\build\model

      - name: Stage installer payload
        run: >
          python installer/build_payload.py
          --backend-dist backend/dist/capset-backend
          --model-dir ${{ github.workspace }}\build\model
          --version ${{ steps.version.outputs.value }}

      - name: Install Inno Setup
        # Not preinstalled on windows-latest.
        run: choco install innosetup -y --no-progress

      - name: Compile installer
        run: >
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          /DAppVersion=${{ steps.version.outputs.value }}
          "/DPayloadDir=${{ github.workspace }}\build\payload"
          installer\windows\capset.iss

      - name: Verify the installer exists and carries the model
        shell: bash
        run: |
          ls -la dist/
          exe="dist/Capset-Setup-${{ steps.version.outputs.value }}.exe"
          test -f "$exe" || { echo "Inno Setup produced no installer"; exit 1; }

          # Ask the staging step what it did, rather than inferring it from a
          # compressed file size. build_payload.py records this, and knows the
          # answer for certain; the .exe only hints at it.
          staged=$(python -c "import json;print(json.load(open('build/payload/payload.json'))['model'])")
          echo "payload reports model: $staged"
          if [ "$staged" = "absent" ]; then
            echo "::error::no speech model was staged — the installer cannot transcribe" >&2
            exit 1
          fi

          # Second line of defence: Inno could drop files from a payload that
          # staged correctly. Measured, not guessed — v0.2.4 without the
          # bundled model was 38,106,093 bytes and v0.3.0 with it was
          # 493,037,673, so 300 MB sits far from both. The previous threshold
          # here was a guessed 500 MB, which rejected that 493 MB build: the
          # first one that ever bundled the model properly.
          size=$(stat -c%s "$exe")
          floor=300000000
          echo "installer is $size bytes ($((size / 1048576)) MiB)"
          if [ "$size" -lt "$floor" ]; then
            echo "::error::installer is $size bytes, below the $floor byte floor for a build carrying the speech model" >&2
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: capset-windows-installer
          path: dist/Capset-Setup-*.exe
          if-no-files-found: error

  macos:
    name: macOS installer
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Resolve version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "value=${{ github.event.inputs.version }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pyinstaller

      - name: Build backend with PyInstaller
        working-directory: backend
        # Same constraint as the Windows job: PyInstaller builds for the
        # machine it runs on. macos-14 runners are Apple Silicon, and
        # onnxruntime publishes macOS wheels for arm64 only, so this package
        # is arm64-only and says so in its distribution definition.
        run: pyinstaller capset-backend.spec --noconfirm --distpath dist --workpath build

      - name: Verify the backend binary exists
        run: |
          test -f backend/dist/capset-backend/capset-backend \
            || { echo "PyInstaller produced no binary"; ls -R backend/dist; exit 1; }
          file backend/dist/capset-backend/capset-backend

      - name: Verify the ASR stack is actually bundled
        # /health answers even when the engine is unusable, so "the service
        # responded" cannot tell a working bundle from a broken one.
        run: |
          if ! ./backend/dist/capset-backend/capset-backend --selftest; then
            echo "::error::the packaged bundle cannot import onnxruntime/onnx_asr"
            exit 1
          fi

      - name: Smoke-test the backend binary
        # Building is not running. On Apple Silicon this also proves the
        # bundle's own signing is intact: the OS SIGKILLs an unsigned arm64
        # binary rather than warning, so a bundle that cannot be executed
        # fails here rather than on the tester's machine.
        run: |
          ./backend/dist/capset-backend/capset-backend > backend-start.log 2>&1 &
          pid=$!
          ok=0
          for i in $(seq 1 30); do
            if ! kill -0 $pid 2>/dev/null; then
              echo "::error::backend binary exited during startup"
              echo "--- backend output ---"; cat backend-start.log
              exit 1
            fi
            if curl -fsS --max-time 3 http://127.0.0.1:8756/health -o health.json; then
              ok=1; break
            fi
            sleep 2
          done
          kill $pid 2>/dev/null || true
          if [ "$ok" != "1" ]; then
            echo "::error::backend binary did not serve /health — the bundle is broken"
            echo "--- backend output ---"; cat backend-start.log
            exit 1
          fi
          echo "backend responded:"; cat health.json

      - name: Download the speech model
        run: >
          python backend/capset_service.py
          --stage-model ${{ github.workspace }}/build/model

      - name: Build the package
        env:
          CAPSET_MODEL_DIR: ${{ github.workspace }}/build/model
        run: ./installer/macos/build-pkg.sh ${{ steps.version.outputs.value }}

      - name: Verify the package exists and carries the model
        run: |
          pkg="dist/Capset-${{ steps.version.outputs.value }}.pkg"
          test -f "$pkg" || { echo "productbuild produced no package"; ls -la dist; exit 1; }

          # Ask the staging step what it did rather than inferring it from a
          # compressed size — build_payload.py knows for certain.
          staged=$(python -c "import json;print(json.load(open('build/payload/payload.json'))['model'])")
          echo "payload reports model: $staged"
          if [ "$staged" = "absent" ]; then
            echo "::error::no speech model was staged — the installer cannot transcribe" >&2
            exit 1
          fi

          # Same reasoning as the Windows floor: a package this far below the
          # model's own compressed size cannot be carrying it.
          size=$(stat -f%z "$pkg")
          floor=300000000
          echo "package is $size bytes ($((size / 1048576)) MiB)"
          if [ "$size" -lt "$floor" ]; then
            echo "::error::package is $size bytes, below the $floor byte floor for a build carrying the speech model" >&2
            exit 1
          fi

          # An arm64-only payload must not offer itself to an Intel Mac: it
          # installs happily and then the backend is killed on first launch.
          if ! grep -q 'hostArchitectures="arm64"' build/distribution.xml; then
            echo "::error::the distribution does not restrict itself to arm64" >&2
            cat build/distribution.xml >&2
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: capset-macos-installer
          path: dist/Capset-*.pkg
          if-no-files-found: error

  release:
    name: Publish release
    needs: [windows, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: capset-windows-installer
          path: dist

      - uses: actions/download-artifact@v4
        with:
          name: capset-macos-installer
          path: dist

      - name: Resolve version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "value=${{ github.event.inputs.version }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Resolve the release notes
        id: notes
        # This path was hardcoded to docs/RELEASE-NOTES-v0.1.md, so every
        # release from v0.1.2 to v0.3.2 was published with v0.1's notes as its
        # body -- describing features and known limitations from eleven tags
        # ago. docs/RELEASING.md always said the notes were resolved per
        # version; the workflow simply never did it.
        #
        # Both spellings are accepted because both exist in practice: the tag
        # is v0.4.0 and the file for it may be named after the full version or
        # after the minor series, the way RELEASE-NOTES-v0.1.md covered every
        # v0.1.x tag.
        run: |
          version="${{ steps.version.outputs.value }}"
          series="${version%.*}"
          for candidate in \
              "docs/RELEASE-NOTES-v$version.md" \
              "docs/RELEASE-NOTES-v$series.md"; do
            if [ -f "$candidate" ]; then
              echo "using $candidate"
              echo "path=$candidate" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done

          # No notes written for this version. Publishing an accurate stub
          # beats two worse options: failing the job after a twenty-minute
          # Windows build that produced a good installer, or attaching notes
          # for some other release and calling it this one's.
          echo "::warning::no release notes found for v$version — publishing a stub"
          stub="docs/RELEASE-NOTES-generated.md"
          {
            echo "# Capset v$version"
            echo
            echo "No release notes were written for this version."
            echo
            echo "See the commit log for what changed:"
            echo "<${{ github.server_url }}/${{ github.repository }}/commits/v$version>"
          } > "$stub"
          echo "path=$stub" >> "$GITHUB_OUTPUT"

      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.value }}
          name: Capset v${{ steps.version.outputs.value }}
          prerelease: ${{ github.event.inputs.prerelease != 'false' }}
          files: |
            dist/Capset-Setup-*.exe
            dist/Capset-*.pkg
          body_path: ${{ steps.notes.outputs.path }}
          fail_on_unmatched_files: true
