name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version, e.g. 0.1.0"
        required: true
        default: "0.1.0"
      prerelease:
        description: "Mark the release as a pre-release"
        type: boolean
        default: true
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  windows:
    name: Windows installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Resolve version
        id: version
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "value=${{ github.event.inputs.version }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pyinstaller

      - name: Build backend with PyInstaller
        working-directory: backend
        # PyInstaller is not a cross-compiler: a Windows exe can only be
        # produced on Windows. That is the whole reason this job exists.
        run: pyinstaller capset-backend.spec --noconfirm --distpath dist --workpath build

      - name: Verify the backend binary exists
        shell: bash
        run: |
          test -f backend/dist/capset-backend/capset-backend.exe \
            || { echo "PyInstaller produced no exe"; ls -R backend/dist; exit 1; }
          echo "backend binary present"

      - name: Verify the ASR stack is actually bundled
        shell: bash
        # /health answers even when the engine is unusable, so "the service
        # responded" cannot distinguish a working bundle from a broken one.
        # v0.1.3 passed the smoke test and shipped with onnxruntime
        # unimportable. This check fails the build instead.
        run: |
          if ! ./backend/dist/capset-backend/capset-backend.exe --selftest; then
            echo "::error::the packaged bundle cannot import onnxruntime/onnx_asr"
            exit 1
          fi

      - name: Smoke-test the backend binary
        shell: bash
        # Verifying the exe EXISTS is not the same as verifying it RUNS. A
        # PyInstaller bundle can build cleanly and still die at startup on a
        # missing hidden import or an uncollected native DLL — which would
        # reach users as "the panel says the service is unreachable" with no
        # clue why. Start it and require a real HTTP answer.
        run: |
          ./backend/dist/capset-backend/capset-backend.exe > backend-start.log 2>&1 &
          pid=$!
          ok=0
          for i in $(seq 1 30); do
            # Bail the moment the process dies rather than retrying a corpse
            # for a minute — the traceback is already in the log.
            if ! kill -0 $pid 2>/dev/null; then
              echo "::error::backend binary exited during startup"
              echo "--- backend output ---"; cat backend-start.log
              exit 1
            fi
            if curl -fsS --max-time 3 http://127.0.0.1:8756/health -o health.json; then
              ok=1; break
            fi
            sleep 2
          done
          kill $pid 2>/dev/null || true
          if [ "$ok" != "1" ]; then
            echo "::error::backend binary did not serve /health — the bundle is broken"
            echo "--- backend output ---"; cat backend-start.log
            exit 1
          fi
          echo "backend responded:"; cat health.json

      - name: Fetch ffmpeg (LGPL build)
        shell: bash
        # LGPL, deliberately NOT the GPL build. The GPL variant would impose
        # GPL obligations on anything distributed alongside it; the LGPL one
        # can be redistributed unmodified with its licence and a source link,
        # which is what LICENSE.txt provides. Invoked as a separate process,
        # never linked into our code.
        run: |
          url="https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-lgpl.zip"
          curl -fsSL "$url" -o ffmpeg.zip
          7z x ffmpeg.zip -offmpeg-extract > /dev/null
          mkdir -p vendor-ffmpeg
          find ffmpeg-extract -name 'ffmpeg.exe'  -exec cp {} vendor-ffmpeg/ \;
          find ffmpeg-extract -name 'ffprobe.exe' -exec cp {} vendor-ffmpeg/ \;
          find ffmpeg-extract -iname 'LICENSE*' -maxdepth 3 -exec cp {} vendor-ffmpeg/FFMPEG-LICENSE.txt \; || true
          ls -la vendor-ffmpeg/
          test -f vendor-ffmpeg/ffmpeg.exe  || { echo "::error::ffmpeg.exe not extracted"; exit 1; }
          test -f vendor-ffmpeg/ffprobe.exe || { echo "::error::ffprobe.exe not extracted"; exit 1; }

      - name: Stage installer payload
        run: >
          python installer/build_payload.py
          --backend-dist backend/dist/capset-backend
          --ffmpeg-dir vendor-ffmpeg
          --version ${{ steps.version.outputs.value }}

      - name: Install Inno Setup
        # Not preinstalled on windows-latest.
        run: choco install innosetup -y --no-progress

      - name: Compile installer
        run: >
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          /DAppVersion=${{ steps.version.outputs.value }}
          "/DPayloadDir=${{ github.workspace }}\build\payload"
          installer\windows\capset.iss

      - name: Verify the installer exists
        shell: bash
        run: |
          ls -la dist/
          test -f "dist/Capset-Setup-${{ steps.version.outputs.value }}.exe" \
            || { echo "Inno Setup produced no installer"; exit 1; }

      - uses: actions/upload-artifact@v4
        with:
          name: capset-windows-installer
          path: dist/Capset-Setup-*.exe
          if-no-files-found: error

  release:
    name: Publish release
    needs: [windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: capset-windows-installer
          path: dist

      - name: Resolve version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "value=${{ github.event.inputs.version }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.value }}
          name: Capset v${{ steps.version.outputs.value }}
          prerelease: ${{ github.event.inputs.prerelease != 'false' }}
          files: dist/Capset-Setup-*.exe
          body_path: docs/RELEASE-NOTES-v0.1.md
          fail_on_unmatched_files: true
